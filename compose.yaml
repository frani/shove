services:
  shove:
    build:
      context: .
      target: final
    container_name: shove
    volumes:
      # Mount credentials as needed, e.g.:
      # - ./shove/fcm:/etc/shove/fcm:ro
      # - ./shove/apns:/etc/shove/apns:ro
      # - ./shove/webpush:/etc/shove/webpush:ro
      - ./shove:/etc/shove:ro
    command:
      [
        "/bin/shove",
        "-api-addr",
        "0.0.0.0:8322",
        "-queue-redis",
        "redis://redis:6379",
      ]
    depends_on:
      - redis
    ports:
      - 8322:8322
  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - ./shove/redis/data:/data
    ports:
      - 6379:6379
